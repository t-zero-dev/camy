name: Native platform validation

on:
  workflow_call:
    inputs:
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string

permissions:
  contents: read

jobs:
  native:
    name: Native ${{ inputs.arch }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config binutils jq
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: native-${{ inputs.arch }}-${{ hashFiles('helper/Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-${{ inputs.arch }}-${{ hashFiles('helper/Cargo.lock') }}-
      - name: Native source and optimized artifact
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo test --manifest-path helper/Cargo.toml --locked
          bash scripts/build-helper-release.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-native-${{ inputs.arch }}
          path: target/dist/camy-helper-${{ inputs.arch }}-unknown-linux-gnu*
          if-no-files-found: error
