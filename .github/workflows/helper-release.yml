name: Helper release candidate

on:
  push:
    tags: ['helper-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  x86:
    uses: ./.github/workflows/native.yml
    with:
      arch: x86_64
      runner: ubuntu-24.04
  arm:
    uses: ./.github/workflows/native.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
  bundle:
    needs: [x86, arm]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: helper-native-*
          merge-multiple: true
          path: target/dist
      - run: bash scripts/package-helper-release.sh target/dist
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: helper-release
          path: target/dist
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/helper-')
    needs: bundle
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: helper-release
          path: target/dist
      - name: Draft immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          version=${tag#helper-}
          notes=$RUNNER_TEMP/helper-notes.md
          printf 'Native Linux downloads for x86_64 and ARM64, with checksums and build metadata.\n\nExisting installations receive this helper when the plugin pin is updated.\n' > "$notes"
          gh release create "$tag" --draft --verify-tag \
            --title "Helper $version" \
            --notes-file "$notes" \
            target/dist/camy-helper-x86_64-unknown-linux-gnu \
            target/dist/camy-helper-x86_64-unknown-linux-gnu.build.json \
            target/dist/camy-helper-aarch64-unknown-linux-gnu \
            target/dist/camy-helper-aarch64-unknown-linux-gnu.build.json \
            target/dist/SHA256SUMS \
            target/dist/release.pin
