name: CI

on:
  pull_request:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helper:
    name: Helper tests and pin format
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ci-x86-${{ hashFiles('helper/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ci-x86-${{ hashFiles('helper/Cargo.lock') }}-
      - name: Format, Clippy, tests, installer
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: |
          cargo fmt --manifest-path helper/Cargo.toml --check
          cargo clippy --manifest-path helper/Cargo.toml --all-targets --locked -- -D clippy::all
          cargo test --manifest-path helper/Cargo.toml --locked
          bash tests/fetch-helper.sh
          bash tests/install-window-rules.sh
          bash tests/write-desktop-entry.sh
          bash tests/run-ensure.sh
  native-arm:
    name: Platform aarch64
    uses: ./.github/workflows/native.yml
    with:
      arch: aarch64
      runner: ubuntu-24.04-arm
