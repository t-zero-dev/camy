[package]
name = "yolocam"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "YoloCam S7/S3 control helper for the Omarchy plugin"

[dependencies]
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["ioctl", "fs", "mman", "poll", "inotify", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
