[package]
name = "camy"
version = "0.2.0"
edition = "2021"
license = "MIT"
description = "CamY helper for YoloLiv YoloCam S7 and S3"

[features]
default = []
# Parked telnet recover. Off by default so vendor credentials are not
# compiled into the helper the panel actually ships.
recover = []

[dependencies]
libc = "0.2"
nix = { version = "0.30", default-features = false, features = ["ioctl", "fs", "mman", "poll", "inotify", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zune-jpeg = "0.4"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
